name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          # Any semver pre-release tag (contains a hyphen, e.g. v1.5.1-rc2)
          # is published as a GitHub prerelease, never as "latest".
          if [[ "$tag" == *-* ]]; then
            prerelease="--prerelease"
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists, leaving it untouched"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes \
              $prerelease
          fi

  build:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Package Node tarball
        run: |
          tar czf "tiny-crow-${GITHUB_REF_NAME}.tar.gz" \
            package.json package-lock.json tsconfig.json \
            src data assets README.md LICENSE

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "tiny-crow-${GITHUB_REF_NAME}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --clobber

  checksums:
    name: SHA256SUMS
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Generate and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          cd dist
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz'
          sha256sum *.tar.gz > SHA256SUMS
          gh release upload "$tag" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
