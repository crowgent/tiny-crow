name: Update model catalog

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate catalog
        run: node scripts/gen-models-catalog.ts

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          commit-message: 'chore: refresh model catalog from models.dev'
          title: 'chore: refresh model catalog from models.dev'
          body: |
            Automated refresh of `data/models.json` and
            `data/tiny-crow-transports.json` from https://models.dev/api.json
            via `scripts/gen-models-catalog.ts`.

            Review the diff for unexpected additions/removals before merging.
          branch: chore/refresh-model-catalog
          delete-branch: true
          add-paths: |
            data/models.json
            data/tiny-crow-transports.json
